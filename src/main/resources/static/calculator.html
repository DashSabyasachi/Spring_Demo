<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<style>
  :root {
    --bg: #e8ebe4; --body: #2f3b36; --screen: #cfe0c3; --ink: #1d2a22;
    --key: #f4f5f0; --key-ink: #2f3b36; --op: #d9822b; --op-ink: #fff; --err: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); font-family: "Trebuchet MS", "Segoe UI", sans-serif; color: var(--ink);
  }
  .calc {
    width: 100%; max-width: 360px; background: var(--body); border-radius: 22px; padding: 20px;
    box-shadow: 0 18px 40px rgba(0,0,0,.25);
  }
  .screen {
    background: var(--screen); border-radius: 10px; padding: 12px 16px; min-height: 96px;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end;
    box-shadow: inset 0 3px 8px rgba(0,0,0,.2); overflow: hidden;
  }
  .expr { font-size: 14px; opacity: .65; min-height: 20px; }
  .result { font-family: "Courier New", monospace; font-size: 38px; font-weight: 700; word-break: break-all; text-align: right; }
  .result.error { font-size: 16px; color: var(--err); font-family: inherit; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 12px; }
  label { color: #c9d3cc; font-size: 13px; display: grid; gap: 4px; }
  input {
    width: 100%; font: inherit; font-size: 18px; padding: 10px; border: 2px solid transparent;
    border-radius: 8px; background: var(--key); color: var(--ink);
  }
  input:focus { outline: none; border-color: var(--op); }
  .ops { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  button {
    font: inherit; font-size: 26px; font-weight: 700; padding: 14px 0; border: 0; border-radius: 10px;
    background: var(--op); color: var(--op-ink); cursor: pointer; box-shadow: 0 4px 0 #9c5d1c;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #9c5d1c; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .clear { grid-column: 1 / -1; background: var(--key); color: var(--key-ink); font-size: 16px; padding: 10px; box-shadow: 0 4px 0 #a9ada3; }
  .history { margin: 16px 0 0; padding: 0; list-style: none; color: #c9d3cc; font-family: "Courier New", monospace; font-size: 14px; }
  .history li { padding: 4px 0; border-top: 1px solid rgba(255,255,255,.12); }
  @media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
</style>
</head>
<body>
<main class="calc">
	<a href="/" style="color:#c9d3cc;font-size:13px;display:inline-block;margin-bottom:10px;">← Home</a>
  <div class="screen" aria-live="polite">
    <div class="expr" id="expr"></div>
    <div class="result" id="result">0</div>
  </div>

  <div class="fields">
    <label>First number <input id="a" type="number" step="any" inputmode="decimal" placeholder="0"></label>
    <label>Second number <input id="b" type="number" step="any" inputmode="decimal" placeholder="0"></label>
  </div>

  <div class="ops">
    <button data-op="add" data-sym="+" aria-label="Add">+</button>
    <button data-op="subtract" data-sym="−" aria-label="Subtract">−</button>
    <button data-op="multiply" data-sym="×" aria-label="Multiply">×</button>
    <button data-op="divide" data-sym="÷" aria-label="Divide">÷</button>
    <button class="clear" id="clear">Clear</button>
  </div>

  <ul class="history" id="history"></ul>
</main>

<script>
  const $ = id => document.getElementById(id);
  const resultEl = $("result"), exprEl = $("expr"), historyEl = $("history");

  function show(text, isError) {
    resultEl.textContent = text;
    resultEl.classList.toggle("error", !!isError);
  }

  async function calculate(op, sym) {
    const a = $("a").value, b = $("b").value;
    if (a === "" || b === "") return show("Enter both numbers", true);
    if (op === "divide" && Number(b) === 0) return show("Can't divide by zero", true);

    exprEl.textContent = `${a} ${sym} ${b}`;
    try {
      // Same origin as Spring Boot, so no CORS setup is needed
      const res = await fetch(`/${op}?a=${encodeURIComponent(a)}&b=${encodeURIComponent(b)}`);
      if (!res.ok) throw new Error("Server returned " + res.status);
      const value = await res.json();
      show(value);
      const li = document.createElement("li");
      li.textContent = `${a} ${sym} ${b} = ${value}`;
      historyEl.prepend(li);
      while (historyEl.children.length > 5) historyEl.lastChild.remove();
    } catch (e) {
      show("Can't reach the server. Is the app running?", true);
    }
  }

  document.querySelectorAll("[data-op]").forEach(btn =>
    btn.addEventListener("click", () => calculate(btn.dataset.op, btn.dataset.sym)));

  $("clear").addEventListener("click", () => {
    $("a").value = ""; $("b").value = ""; exprEl.textContent = ""; show("0"); $("a").focus();
  });
</script>
</body>
</html>
