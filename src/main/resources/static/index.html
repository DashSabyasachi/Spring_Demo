<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<style>
  :root {
    --bg: #e8ebe4; --body: #2f3b36; --ink: #1d2a22;
    --key: #f4f5f0; --key-ink: #2f3b36; --op: #d9822b; --op-ink: #fff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--bg); font-family: "Trebuchet MS", "Segoe UI", sans-serif; color: var(--ink);
  }
  .card {
    width: 100%; max-width: 480px; background: var(--body); border-radius: 22px; padding: 28px;
    box-shadow: 0 18px 40px rgba(0,0,0,.25); color: #e8ebe4;
  }
  h1 { margin: 0 0 4px; font-size: 24px; color: #fff; }
  .sub { margin: 0 0 22px; font-size: 13px; color: #c9d3cc; }
  .menu { display: grid; gap: 12px; }
  .menu a {
    display: block; text-align: center; text-decoration: none; font-size: 17px; font-weight: 700;
    padding: 14px 16px; border-radius: 10px; background: var(--op); color: var(--op-ink);
    box-shadow: 0 4px 0 #9c5d1c;
  }
  .menu a:active { transform: translateY(3px); box-shadow: 0 1px 0 #9c5d1c; }
  .menu a:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .menu small { display: block; font-weight: 400; font-size: 12px; opacity: .85; margin-top: 2px; }
</style>
</head>
<body>
<main class="card">
  <h1>My Spring Boot App</h1>
  <p class="sub">Choose a page to open.</p>
  <nav class="menu" id="menu"></nav>
</main>

<script>
  // To add a new page, add one line here.
  const pages = [
    { name: "Calculator",          url: "/calculator",          desc: "Add, subtract, multiply, divide" },
    { name: "Employee Management", url: "/employees", desc: "Add, search and delete employees" },
    // { name: "New Page", url: "/new-page", desc: "What it does" },
  ];

  const menu = document.getElementById("menu");
  pages.forEach(p => {
    const a = document.createElement("a");
    a.href = p.url;
    a.innerHTML = `${p.name}<small>${p.desc}</small>`;
    menu.appendChild(a);
  });
</script>
</body>
</html>
